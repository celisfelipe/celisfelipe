<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-labelledby="t d">
  <title id="t">Felipe Celis Montoya — Aprendiz en Desarrollo de Software</title>
  <desc id="d">Un circuito eléctrico lleva corriente hasta un chip que la convierte en código y enciende el nombre.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1b2230"/>
    </pattern>
    <clipPath id="reveal">
      <rect x="500" y="140" width="0" height="34">
        <animate attributeName="width" from="0" to="470" dur="1.4s" begin="1.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    .trace{fill:none;stroke:#222b38;stroke-width:2;stroke-linejoin:round}
    .pulse{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-dasharray:10 100;stroke-dashoffset:10;animation:flow 2.8s linear infinite}
    .in{stroke:#58a6ff}
    .out{stroke:#f0b429}
    .d1{animation-delay:.3s}.d2{animation-delay:.9s}.d3{animation-delay:1.5s}.d4{animation-delay:2.1s}
    .node{fill:#2b3545}
    .blink{animation:blink 2.8s ease-in-out infinite}
    .chip{fill:#121822;stroke:#30363d;stroke-width:2;animation:charge 2.8s ease-in-out infinite}
    .pin{fill:#3a4556}
    .mono{font-family:'Cascadia Code','Fira Code',Consolas,'Courier New',monospace}
    .sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .name{fill:#e6edf3;font-size:42px;font-weight:600;opacity:0;animation:neon 1.6s ease-out .5s forwards}
    .sub{fill:#9fb3c8;font-size:19px}
    .tag{fill:#6e7b8b;font-size:14px;opacity:0;animation:fade .8s ease-out 3s forwards}
    .cursor{fill:#f0b429;opacity:0;animation:fade .1s linear 3s forwards,caret 1s steps(1) 3.1s infinite}
    .volt{fill:#3d4a5c;font-size:11px;letter-spacing:1px}
    @keyframes flow{from{stroke-dashoffset:10}to{stroke-dashoffset:-100}}
    @keyframes blink{0%,100%{fill:#2b3545}45%{fill:#58a6ff}}
    @keyframes charge{0%,100%{stroke:#30363d}50%{stroke:#58a6ff}}
    @keyframes neon{0%{opacity:0}12%{opacity:1}16%{opacity:.15}24%{opacity:1}28%{opacity:.35}38%,100%{opacity:1}}
    @keyframes fade{to{opacity:1}}
    @keyframes caret{0%{opacity:1}50%{opacity:0}}
  </style>

  <rect width="1000" height="280" rx="16" fill="#0d1117"/>
  <rect width="1000" height="280" rx="16" fill="url(#dots)"/>
  <rect x=".5" y=".5" width="999" height="279" rx="16" fill="none" stroke="#30363d"/>

  <text x="22" y="40" class="mono volt">AC 120V</text>

  <g>
    <path class="trace" d="M0 70 H120 V112 H330" pathLength="100"/>
    <path class="trace" d="M0 132 H330" pathLength="100"/>
    <path class="trace" d="M0 214 H170 V152 H330" pathLength="100"/>
    <path class="trace" d="M60 280 V246 H262 V172 H330" pathLength="100"/>

    <path class="pulse in" d="M0 70 H120 V112 H330" pathLength="100"/>
    <path class="pulse in d2" d="M0 132 H330" pathLength="100"/>
    <path class="pulse in d1" d="M0 214 H170 V152 H330" pathLength="100"/>
    <path class="pulse in d3" d="M60 280 V246 H262 V172 H330" pathLength="100"/>
  </g>

  <circle class="node blink" cx="120" cy="70" r="4"/>
  <circle class="node blink d2" cx="120" cy="112" r="4"/>
  <circle class="node blink d1" cx="170" cy="214" r="4"/>
  <circle class="node blink d3" cx="170" cy="152" r="4"/>
  <circle class="node blink d4" cx="262" cy="246" r="4"/>
  <circle class="node" cx="262" cy="172" r="4"/>

  <g>
    <rect class="pin" x="322" y="108" width="8" height="8" rx="1"/>
    <rect class="pin" x="322" y="128" width="8" height="8" rx="1"/>
    <rect class="pin" x="322" y="148" width="8" height="8" rx="1"/>
    <rect class="pin" x="322" y="168" width="8" height="8" rx="1"/>
    <rect class="pin" x="430" y="116" width="8" height="8" rx="1"/>
    <rect class="pin" x="430" y="138" width="8" height="8" rx="1"/>
    <rect class="pin" x="430" y="160" width="8" height="8" rx="1"/>
    <rect class="chip" x="330" y="96" width="100" height="92" rx="12"/>
    <text x="380" y="151" text-anchor="middle" class="mono" font-size="28" font-weight="700" fill="#58a6ff">&lt;/&gt;</text>
    <text x="380" y="210" text-anchor="middle" class="mono volt">SENA · ADSO</text>
  </g>

  <g>
    <path class="trace" d="M438 120 H458 V96 H484" pathLength="100"/>
    <path class="trace" d="M438 142 H484" pathLength="100"/>
    <path class="trace" d="M438 164 H458 V190 H484" pathLength="100"/>
    <path class="pulse out d1" d="M438 120 H458 V96 H484" pathLength="100"/>
    <path class="pulse out d2" d="M438 142 H484" pathLength="100"/>
    <path class="pulse out d3" d="M438 164 H458 V190 H484" pathLength="100"/>
  </g>
  <circle class="node blink d1" cx="484" cy="96" r="3"/>
  <circle class="node blink d2" cx="484" cy="142" r="3"/>
  <circle class="node blink d3" cx="484" cy="190" r="3"/>

  <text x="500" y="112" class="sans name">Felipe Celis Montoya</text>
  <g clip-path="url(#reveal)">
    <text x="500" y="163" class="sans sub">Aprendiz en Desarrollo de Software · SENA</text>
  </g>
  <text x="500" y="199" class="mono tag">// de los circuitos al código</text>
  <rect class="cursor" x="749" y="187" width="8" height="15"/>
</svg>
